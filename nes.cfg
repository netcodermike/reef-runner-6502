MEMORY {
    ZP:      file = "", start = $0000, size = $0100, type = rw;
    RAM:     file = "", start = $0300, size = $0500, type = rw;
    HDR:     file = %O, start = $0000, size = $0010, fill = yes;
    PRG:     file = %O, start = $C000, size = $3FFA, fill = yes, fillval = $FF;
    VEC:     file = %O, start = $FFFA, size = $0006, fill = yes;
    PATTERN: file = %O, start = $0000, size = $2000, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp, optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes;
    HEADER:   load = HDR,     type = ro;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro, optional = yes;
    VECTORS:  load = VEC,     type = ro;
    CHR:      load = PATTERN, type = ro;
}
